# fly.toml — Wassell presentations cloud worker
#
# This is a long-running Node process (no HTTP listener, no public ports).
# It polls Supabase for queued jobs and runs them against the Anthropic API.
#
# Before first deploy:
#   1. fly launch --no-deploy   (in this folder; pick a unique app name)
#   2. fly secrets set SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... ANTHROPIC_API_KEY=...
#   3. fly deploy
#
# This file ships with sensible defaults for Phase 0:
#   - 1 machine, never autoscaled (enforces "single worker" semantics)
#   - shared-cpu-1x with 1GB RAM (plenty for an idle poll loop + one Anthropic call)
#   - region defaults are picked at `fly launch` time
#
# We'll revisit memory/CPU in Phase 4 when the Paseetah tool may need more headroom.

# `app` is filled in by `fly launch`; leave commented until then.
# app = "wassell-presentations-worker"

primary_region = "fra"  # Frankfurt — change to whatever's closest to your Supabase region

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  POLL_INTERVAL_MS = "5000"
  HEARTBEAT_INTERVAL_MS = "15000"
  JOB_TIMEOUT_SECONDS = "1800"

# No [[services]] block — this worker has no HTTP listener. fly will keep the
# machine running 24/7 because there's nothing to scale to zero on.

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1
