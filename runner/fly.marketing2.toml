# Second runner on the marketing-intelligence lane.
#
#   wassel-claude-runner       lease 'marketing_intelligence'    ┐ same kinds,
#   wassel-claude-marketing-2  lease 'marketing_intelligence_2'  ┘ two sessions
#   wassel-claude-interactive  lease 'interactive'               → ping, client_study
#   wassel-claude-ocr          lease 'ocr'                       → mkt_visual_ocr
#
# WHY A SECOND APP AND NOT `fly scale count 2`. claude_runner_lease has
# lease_name as its PRIMARY KEY, so two machines asking for the same lease can
# never both hold it — the loser waits out the TTL and exits 0. That is the
# singleton guarantee, and it is worth keeping. Capacity on a lane is therefore
# a function of how many lease NAMES may claim its kinds, which is what
# supabase/migrations/2026-08-26_second_marketing_runner.sql changes.
#
# REQUIRES THAT MIGRATION. Without it this runner acquires
# 'marketing_intelligence_2' successfully and then claims nothing, because the
# claim function does not recognise the name — it would idle politely forever.
#
# Every other guarantee is unchanged: one session per lease name, claims are
# FOR UPDATE SKIP LOCKED so the two never take the same job, and either can
# adopt the other's work if its lease goes unheld.
#
# Deploy from the repo root (the build context needs scripts/ and .claude/):
#   flyctl deploy --config runner/fly.marketing2.toml --app wassel-claude-marketing-2
#
# To go back to one runner: stop this app. No migration needed — an unheld lease
# name is inert.
app = 'wassel-claude-marketing-2'

# MUST stay above the runner's SHUTDOWN_GRACE_MS (60s) — Fly's 5s default would
# SIGKILL mid-shutdown and orphan the in-flight session.
kill_timeout = '90s'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  POLL_MS = '10000'
  RUNNER_ENV = 'fly'
  # The whole point of this app.
  RUNNER_LEASE = 'marketing_intelligence_2'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'

[deploy]
  strategy = 'immediate'

[processes]
  app = 'node scripts/claude-study-runner.mjs'
