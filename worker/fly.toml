# fly.toml app configuration file generated for wassel-deck-worker on 2026-05-18T07:41:42+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wassel-deck-worker'
primary_region = 'sin'
# Seconds between SIGTERM and SIGKILL on a deploy / scale-down (Fly default 5).
# The worker drains for up to 60 s; with 5 s, a portal run waiting for a code
# was killed mid-run and lost (2026-10-05). 30 s lets it hand itself back to the
# queue and lets short jobs on other lanes finish.
kill_timeout = 30

[build]

[env]
  NODE_ENV = 'production'
  POLL_INTERVAL_MS = '3000'
  PORT = '8080'
  WATCHDOG_INTERVAL_MS = '300000'
  # Shot jobs at a time per dedicated `cv` machine (read only there). The Gemini
  # call is most of each ~30 s job, so 4 fit on 2 dedicated cores (2026-10-05).
  CV_PROCESS_LOOPS = '4'
  # Collection/reading claim loops per general machine. 3 since 2026-10-05: with
  # shots moved off, a machine sat at ~185 MB of 459 and load ~0.2, and Apify
  # history runs (up to ~90 min each) were the slowest part of the catch-up.
  # Raised to 6 on 2026-10-08 and reverted within minutes: the raw-capture lane
  # ran one ffmpeg (~70 MB) per image per loop and OOM-killed the 512 MB
  # machines until Fly left them stopped. Image conversions are now capped at 2
  # per process (ffmpegMedia IMAGE_FFMPEG_MAX); keep 3 here regardless.
  MARKETING_LOOPS = '3'
  # Marketing claim loops on the dedicated `cv` machine (performance-2x, 4 GB).
  # 8 since 2026-10-08 for the raw-capture backlog (each job ~45 s waiting on
  # OpenAI, little CPU or memory once conversions are capped).
  CV_MARKETING_LOOPS = '8'

# Two process groups, same image/command:
#   app    — the general worker: all lanes EXCEPT the unit-pdf renderer. 512MB × 5.
#   render — headless-Chromium unit-pdf renderer ONLY (Fly sets FLY_PROCESS_GROUP=
#            'render', which index.ts reads to run render-only). Bigger VM because
#            chromium starves on the busy 512MB general machines. Durable across
#            deploys — the group + its [[vm]] live here, not as a per-machine hack.
[processes]
  app = 'node dist/index.js'
  render = 'node dist/index.js'
  cv = 'node dist/index.js'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  # Always keep 5 workers warm. Each polls the deck_jobs queue independently;
  # Postgres FOR UPDATE SKIP LOCKED guarantees no two workers claim the same
  # job. With ~3 KB of code and a 200ms cold start, the only reason a machine
  # is idle is the queue itself being empty.
  min_machines_running = 5
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['app']

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2048mb'
  processes = ['render']

# cv — video shot jobs ONLY (ffmpeg + Gemini). Dedicated cores: on shared-cpu the
# ffmpeg steps were throttled 5-20x and starved post reading (measured
# 2026-10-04). Scale with `fly scale count cv=N`; at 0, set CV_ON_GENERAL=1 or
# no shot job runs anywhere.
[[vm]]
  size = 'performance-2x'
  memory = '4096mb'
  processes = ['cv']
