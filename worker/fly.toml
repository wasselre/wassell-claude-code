# fly.toml app configuration file generated for wassel-deck-worker on 2026-05-18T07:41:42+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wassel-deck-worker'
primary_region = 'sin'

[build]

[env]
  NODE_ENV = 'production'
  POLL_INTERVAL_MS = '3000'
  PORT = '8080'
  WATCHDOG_INTERVAL_MS = '300000'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  # Always keep 5 workers warm. Each polls the deck_jobs queue independently;
  # Postgres FOR UPDATE SKIP LOCKED guarantees no two workers claim the same
  # job. With ~3 KB of code and a 200ms cold start, the only reason a machine
  # is idle is the queue itself being empty.
  min_machines_running = 5

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
