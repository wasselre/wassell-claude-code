# CI gate (W0 of the bilingual-architecture plan, REV 4 Part E).
#
# Before this workflow existed the repo had NO automated gate — build,
# typecheck, tests, and the service-client audit were local discipline only
# (verified in the 2026-08-02 W-A audit). Every push/PR to main now runs them.
#
# The ephemeral-database integration stage (validated translation DDL + SQL
# tests from supabase/tests/) is added by W1 alongside the migration files it
# exercises — it needs the migrations + a schema bootstrap to exist first.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install (root)
        run: npm ci
      # The root vitest run covers worker/ too, and the worker is a SEPARATE
      # package — its dependencies are not in the root lockfile. Since
      # 2026-09-27 that is load-bearing: worker/src/repairFileMediaMeta.ts
      # imports `sharp` (a worker dependency), so without this step the test
      # file fails to LOAD and the whole job goes red with an error that names
      # an unrelated test — main was broken for hours that way. Install the
      # worker's deps here or stop running its tests in this job; do not leave
      # the run half-provisioned.
      - name: Install (worker — the root vitest run includes its tests)
        working-directory: worker
        run: npm ci
      - name: Service-client factory audit
        run: npm run check:service-clients
      - name: Typecheck + build (tsc -b, tsconfig.api.json, vite)
        run: npm run build
        env:
          # Build must succeed without secrets; Vite env is optional at build time.
          CI: 'true'
      - name: Unit tests (vitest — src/, api/, worker/)
        run: npm test

  authz-helper-scoping:
    # Its OWN job, not another step on the db-migrations workflow. Each Files authorization
    # suite now takes ~10 minutes (three full fingerprint sweeps over an 8k
    # corpus), and stacking a fourth onto that job blew the 25-minute cap with
    # the security test barely started. Separate jobs also run in parallel.
    #
    # Designated validator for
    # supabase/migrations/2026-08-17_01_scope_authz_helpers.sql. It reproduces
    # the direct-RPC bypass, applies the fix, and requires the bypass gone while
    # files_select reach stays byte-identical.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Authz helper scoping — direct-RPC abuse, reach unchanged
        run: bash supabase/tests/ci/run_helper_scoping_test.sh

  b5-file-views:
    # Designated validator for
    # supabase/migrations/2026-08-19_10_file_views.sql (Phase 3 · B5 — saved
    # views + the file_document_types read grant). The db-migrations workflow globs
    # specific date prefixes and would never execute it, so it gets its own job,
    # the same way B1 and B2A do.
    #
    # The interesting assertions are the OWNERSHIP ones, and they only mean
    # something under a real `authenticated` role with JWT claims — inside a DO
    # block the invoking superuser bypasses RLS entirely and every one of them
    # would pass while testing nothing. The smoke does both, and the runner
    # refuses to report success on a fixture with fewer than two users.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: B5 — saved views, ownership under RLS, idempotency, rollback
        run: bash supabase/tests/ci/run_b5_file_views_test.sh

  b6-manual-links:
    # Designated validator for Phase 3 · B6 —
    #   supabase/migrations/2026-08-19_11_manual_link_write_surface.sql
    #   supabase/migrations/2026-08-19_12_manual_link_role.sql
    # The db-migrations workflow globs specific date prefixes and would execute
    # neither, so they get their own job, the same way B1 and B5 do.
    #
    # The load-bearing assertion is that the role change is a NO-OP on existing
    # data: it compares a fingerprint of the WHOLE live-source derivation —
    # keyed by source AND role, because a count would not notice a role moving
    # — before and after, for the global function AND its scoped twin, and
    # requires the two to still equal each other (Phase 2's own invariant).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: B6 — manual links, grant hardening, role fix, rollback
        run: bash supabase/tests/ci/run_b6_manual_links_test.sh

  b2a4-authz:
    # Designated validator for
    # supabase/migrations/2026-08-18_02_link_authz_denormalized.sql (B2A.4).
    # Proves, on a production-shaped ~7k-edge corpus, that no persona gains an
    # edge, that both halves of the rule are actually tested (two mutants),
    # that the denormalized authorization columns cannot go stale, and that
    # the facets get faster rather than slower.
    #
    # The two exploratory profiling steps that used to run here are gone. They
    # answered their questions — unified_records costs 0.2 ms and is innocent,
    # and the COST-hint hypothesis is refuted because hashed SubPlans are
    # evaluated after ordinary quals regardless of declared cost — and kept
    # charging ~7 minutes per run to re-answer them. The scripts remain in
    # supabase/tests/ci/ to be run by hand if the question comes back.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: B2A.4 — edge equivalence, negative controls, perf
        run: |
          B2=""
          if git fetch --depth=1 origin claude/phase3-b2-search 2>/dev/null; then
            mkdir -p /tmp/b2
            if git show FETCH_HEAD:supabase/migrations/2026-08-16_02_business_files_search.sql > /tmp/b2/b2.sql 2>/dev/null; then B2=/tmp/b2/b2.sql; fi
          fi
          B2_MIGRATION="$B2" bash supabase/tests/ci/run_b2a4_link_authz_test.sh

      # Phase 3 · B2 (business_files_search). Own database again, and its own
      # 8,000-row corpus: the 19-row Phase 1 fixture can prove projection shapes
      # but says nothing about whether search is fast or whether facet counts
      # stay correct once a bucket has thousands of members. Also asserts the
      # p95 < 300 ms budget as a NON-ADMIN, which is the expensive RLS path.
      - name: File search (B2) — migration, 8k corpus, smoke, RLS, p95, rollback
        run: bash supabase/tests/ci/run_b2_search_test.sh

  market-listings-reconciliation:
    # Designated validator for
    # supabase/migrations/2026-09-04_00_market_listings_view_reconciliation.sql.
    # The db-migrations workflow (.github/workflows/db-migrations.yml) globs
    # only 2026-09-01_0* and 2026-09-02_0*,
    # so it never executes that migration — this job exists to run it (via the
    # fixture + assertions in supabase/tests/ci/run_market_listings_reconciliation_test.sh)
    # against an ephemeral Postgres 17 before any production apply.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run reconciliation migration tests
        run: bash supabase/tests/ci/run_market_listings_reconciliation_test.sh

  market-ingest-gate-a:
    # Designated validator for the four additive Gate A migrations
    # supabase/migrations/2026-09-05_0{1,2,3,4}_*.sql. The db-migrations workflow
    # above globs only 2026-09-01_0* and 2026-09-02_0*, so it never executes
    # the 2026-09-05_0* Gate A set — this job exists to run them (via the
    # fixture + assertions driven by
    # supabase/tests/ci/run_market_ingest_gate_a_test.sh) against an ephemeral
    # Postgres 17 before any production apply. It proves the four migrations
    # against the SUPPORTED PREDECESSOR FIXTURE — NOT fresh-database parity,
    # which stays blocked until the deferred market_listings freeze baseline
    # (2026-09-05_05) lands.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run Gate A ingest migration tests
        run: bash supabase/tests/ci/run_market_ingest_gate_a_test.sh

  ingestion-write-path:
    # Designated validator for 2026-09-06_01_ingestion_write_path.sql — the
    # owner-run definer write-path RPCs. Applies the Gate A fixture + _01..04 +
    # the write-path migration on an ephemeral Postgres 17, proves idempotent
    # re-apply and the functional/ACL contract (capture idempotency, optional-
    # absent vs schema-gap, service_role-only EXECUTE).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run ingestion write-path tests
        run: bash supabase/tests/ci/run_ingestion_write_path_test.sh

  market-publisher:
    # Designated validator for 2026-09-06_02_market_listings_publisher.sql — the
    # controlled canonical publisher. Applies the full chain + a minimal
    # market_listings publisher fixture (which makes NO fresh-vs-prod parity
    # claim), proves idempotent re-apply, and exercises the publisher contract
    # (allowlist/flag gate, insert/update identity, destructive quarantine,
    # required-field + ambiguous-identity rejection, service_role-only EXECUTE).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run market publisher tests
        run: bash supabase/tests/ci/run_market_publisher_test.sh

  freeze-baseline-sequence:
    # Designated validator for the FULL market-ingest replay chain:
    #   pre-freeze predecessor fixture
    #   -> 2026-09-03_02_market_listings_freeze_baseline.sql
    #   -> UNMODIFIED 2026-09-04_00_market_listings_view_reconciliation.sql
    #   -> 2026-09-05_01..04 -> 2026-09-05_06
    # It exists because the baseline's whole purpose is to establish the exact
    # predecessor state 2026-09-04_00 pins by md5 — that convergence is executed
    # here, never assumed. Also proves the five-way unified_records fingerprint,
    # the production-shaped assert-only path, idempotency, and fail-closed drift.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run freeze-baseline sequence tests
        run: bash supabase/tests/ci/run_freeze_baseline_sequence_test.sh

  market-raw-storage:
    # Designated validator for 2026-09-05_08_market_raw_storage.sql.
    # CI cannot reach the Storage HTTP API, so this proves the half that lives in
    # Postgres: the policy predicates evaluated as the dedicated uploader, a
    # normal authenticated user, and an admin. The HTTP half (upsert, move/copy,
    # signed URLs, anon) is proven once against production by
    # scripts/market-raw-canary.mjs after apply.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run market-raw storage policy tests
        run: bash supabase/tests/ci/run_market_raw_storage_test.sh

  worker-typecheck:
    # worker/ is a standalone package (third tsconfig) — not covered by the
    # root build (see reference: tsc --noEmit skips api/; worker is separate).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install (worker)
        working-directory: worker
        run: npm ci
      - name: Typecheck worker
        working-directory: worker
        run: npx tsc --noEmit
      - name: Ingest adapter tests (worker)
        working-directory: worker
        run: npm run test:ingest
