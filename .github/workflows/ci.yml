# CI gate (W0 of the bilingual-architecture plan, REV 4 Part E).
#
# Before this workflow existed the repo had NO automated gate — build,
# typecheck, tests, and the service-client audit were local discipline only
# (verified in the 2026-08-02 W-A audit). Every push/PR to main now runs them.
#
# The ephemeral-database integration stage (validated translation DDL + SQL
# tests from supabase/tests/) is added by W1 alongside the migration files it
# exercises — it needs the migrations + a schema bootstrap to exist first.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install (root)
        run: npm ci
      - name: Service-client factory audit
        run: npm run check:service-clients
      - name: Typecheck + build (tsc -b, tsconfig.api.json, vite)
        run: npm run build
        env:
          # Build must succeed without secrets; Vite env is optional at build time.
          CI: 'true'
      - name: Unit tests (vitest — src/, api/, worker/)
        run: npm test

  db-migrations:
    # Ephemeral-database integration stage (bilingual W1): executes the
    # translation migrations against a blank Postgres 17 with the fixture
    # bootstrap, then runs the smoke assertions. This is the designated
    # validator for the 2026-09-01_* migration set — production apply is
    # gated on this job being green.
    runs-on: ubuntu-latest
    # Raised from 10 for Phase 3 B2A: proving that an authorization change moves
    # nobody's reach means sweeping sorted file-ID fingerprints for 7 personas x
    # 3 kinds over an 8,000-row corpus, three times (before, after, after
    # rollback). That is ~7 minutes on a shared runner and it is the point of
    # the job, not overhead to trim.
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: wassell_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:ci@localhost:5432/wassell_ci
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap fixture
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/ci/bootstrap_fixture.sql
      - name: Apply translation migrations (W1 set + W4 server-language)
        run: |
          for f in supabase/migrations/2026-09-01_0*.sql supabase/migrations/2026-09-02_0*.sql; do
            echo "== $f"
            psql "$PGURL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Smoke assertions
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/ci/smoke_translation.sql

      # The file-link projection (Phase 1) needs its own fixture: the translation
      # bootstrap has no models/records/files tables. Without this step the
      # db-migrations badge would be green while never executing this migration
      # at all — the exact false signal called out in the Phase 1 design.
      - name: File-link projection — fixture, migration, smoke
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE wassell_file_links;'
          PGURL_FL="${PGURL%/*}/wassell_file_links"
          psql "$PGURL_FL" -v ON_ERROR_STOP=1 -f supabase/tests/ci/fixture_file_links.sql
          psql "$PGURL_FL" -v ON_ERROR_STOP=1 -f supabase/migrations/2026-08-10_file_links_projection.sql
          psql "$PGURL_FL" -v ON_ERROR_STOP=1 -f supabase/tests/ci/smoke_file_links.sql

      # Phase 2 (synchronisation) gets its OWN database. It cannot share the one
      # above: smoke_file_links.sql parts 4 and 5 deliberately induce drift to
      # prove the reconciler sees it, and Phase 2 exists to make that drift
      # impossible. Those sixteen scenarios are re-run inverted in part 3 of the
      # sync smoke, so nothing is lost by separating them.
      - name: File-link sync — fixture, both migrations, smoke
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE wassell_file_link_sync;'
          PGURL_FS="${PGURL%/*}/wassell_file_link_sync"
          psql "$PGURL_FS" -v ON_ERROR_STOP=1 -f supabase/tests/ci/fixture_file_links.sql
          psql "$PGURL_FS" -v ON_ERROR_STOP=1 -f supabase/migrations/2026-08-10_file_links_projection.sql
          psql "$PGURL_FS" -v ON_ERROR_STOP=1 -f supabase/migrations/2026-08-12_file_link_sync.sql
          psql "$PGURL_FS" -v ON_ERROR_STOP=1 -f supabase/tests/ci/smoke_file_link_sync.sql

      # Two REAL concurrent sessions. The first design passed every single-session
      # test and still deadlocked 11 runs in 12 here, so this is not optional.
      - name: File-link sync — concurrency (two live sessions)
        run: bash supabase/tests/ci/concurrency_file_link_sync.sh

      # Phase 3 · B1 (business-file metadata). Its own database again, because
      # it adds RLS + an authorization surface to `files` that the Phase 1/2
      # smokes deliberately run without. The runner also owns the checks that
      # need state either side of the apply: projection untouched, reach
      # unchanged, idempotent re-apply, and a rollback that restores the exact
      # pre-B1 structure.
      - name: File metadata (B1) — fixtures, migration, smoke, rollback
        run: bash supabase/tests/ci/run_b1_metadata_test.sh

      # Phase 3 · B2A (file authorization performance). This one changes an
      # AUTHORIZATION path, so the gate is not "it got faster": the runner
      # captures per-persona, per-kind sorted file-ID fingerprints BEFORE the
      # migration and requires them byte-identical AFTER. It also pulls B2 from
      # its own branch (PR #21) to answer whether business_files_search reaches
      # its 300 ms budget once the authorization cost is removed — without
      # mixing the two batches' trees.
      - name: File authorization performance (B2A) — equivalence, perf, rollback
        run: |
          B2=""
          if git fetch --depth=1 origin claude/phase3-b2-search 2>/dev/null; then
            mkdir -p /tmp/b2
            if git show FETCH_HEAD:supabase/migrations/2026-08-16_02_business_files_search.sql \
                 > /tmp/b2/b2.sql 2>/dev/null; then B2=/tmp/b2/b2.sql; fi
          fi
          B2_MIGRATION="$B2" bash supabase/tests/ci/run_b2a_authz_perf_test.sh

      # Phase 3 · B2A.2 (set-based grant/folder resolution, identity-guarded).
      # Same equivalence
      # bar as B2A, plus synthetic high-cardinality personas (3,000 direct
      # grants, a 12-deep folder chain) that exist to make a wrong design fail:
      # an InitPlan-array membership test is a linear scan per row and would
      # visibly lose here, while a hash semi-join holds.
      - name: File authz grant sets (B2A.2) — equivalence, high-cardinality, perf
        run: |
          B2=""
          if git fetch --depth=1 origin claude/phase3-b2-search 2>/dev/null; then
            mkdir -p /tmp/b2
            if git show FETCH_HEAD:supabase/migrations/2026-08-16_02_business_files_search.sql                  > /tmp/b2/b2.sql 2>/dev/null; then B2=/tmp/b2/b2.sql; fi
          fi
          B2_MIGRATION="$B2" bash supabase/tests/ci/run_b2a2_grant_sets_test.sh
  authz-helper-scoping:
    # Its OWN job, not another step on db-migrations. Each Files authorization
    # suite now takes ~10 minutes (three full fingerprint sweeps over an 8k
    # corpus), and stacking a fourth onto that job blew the 25-minute cap with
    # the security test barely started. Separate jobs also run in parallel.
    #
    # Designated validator for
    # supabase/migrations/2026-08-17_01_scope_authz_helpers.sql. It reproduces
    # the direct-RPC bypass, applies the fix, and requires the bypass gone while
    # files_select reach stays byte-identical.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Authz helper scoping — direct-RPC abuse, reach unchanged
        run: bash supabase/tests/ci/run_helper_scoping_test.sh

  market-listings-reconciliation:
    # Designated validator for
    # supabase/migrations/2026-09-04_00_market_listings_view_reconciliation.sql.
    # The db-migrations job above globs only 2026-09-01_0* and 2026-09-02_0*,
    # so it never executes that migration — this job exists to run it (via the
    # fixture + assertions in supabase/tests/ci/run_market_listings_reconciliation_test.sh)
    # against an ephemeral Postgres 17 before any production apply.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run reconciliation migration tests
        run: bash supabase/tests/ci/run_market_listings_reconciliation_test.sh

  market-ingest-gate-a:
    # Designated validator for the four additive Gate A migrations
    # supabase/migrations/2026-09-05_0{1,2,3,4}_*.sql. The db-migrations job
    # above globs only 2026-09-01_0* and 2026-09-02_0*, so it never executes
    # the 2026-09-05_0* Gate A set — this job exists to run them (via the
    # fixture + assertions driven by
    # supabase/tests/ci/run_market_ingest_gate_a_test.sh) against an ephemeral
    # Postgres 17 before any production apply. It proves the four migrations
    # against the SUPPORTED PREDECESSOR FIXTURE — NOT fresh-database parity,
    # which stays blocked until the deferred market_listings freeze baseline
    # (2026-09-05_05) lands.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run Gate A ingest migration tests
        run: bash supabase/tests/ci/run_market_ingest_gate_a_test.sh

  freeze-baseline-sequence:
    # Designated validator for the FULL market-ingest replay chain:
    #   pre-freeze predecessor fixture
    #   -> 2026-09-03_02_market_listings_freeze_baseline.sql
    #   -> UNMODIFIED 2026-09-04_00_market_listings_view_reconciliation.sql
    #   -> 2026-09-05_01..04 -> 2026-09-05_06
    # It exists because the baseline's whole purpose is to establish the exact
    # predecessor state 2026-09-04_00 pins by md5 — that convergence is executed
    # here, never assumed. Also proves the five-way unified_records fingerprint,
    # the production-shaped assert-only path, idempotency, and fail-closed drift.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run freeze-baseline sequence tests
        run: bash supabase/tests/ci/run_freeze_baseline_sequence_test.sh

  market-raw-storage:
    # Designated validator for 2026-09-05_08_market_raw_storage.sql.
    # CI cannot reach the Storage HTTP API, so this proves the half that lives in
    # Postgres: the policy predicates evaluated as the dedicated uploader, a
    # normal authenticated user, and an admin. The HTTP half (upsert, move/copy,
    # signed URLs, anon) is proven once against production by
    # scripts/market-raw-canary.mjs after apply.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run market-raw storage policy tests
        run: bash supabase/tests/ci/run_market_raw_storage_test.sh

  worker-typecheck:
    # worker/ is a standalone package (third tsconfig) — not covered by the
    # root build (see reference: tsc --noEmit skips api/; worker is separate).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install (worker)
        working-directory: worker
        run: npm ci
      - name: Typecheck worker
        working-directory: worker
        run: npx tsc --noEmit
