name: Sync model & workflow PRDs

# Keeps docs/prd/models + docs/prd/workflows in step with the live Supabase DB,
# 24/7, with no manual commits. Regenerates via scripts/sync-model-workflow-prds.mjs
# and commits ONLY when something actually changed (the script is deterministic, so
# an unchanged DB produces no diff and this job no-ops). Vercel skips these
# docs-only commits via the ignoreCommand in vercel.json, so they never trigger a
# production build.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL                 your project URL
#   SUPABASE_SERVICE_ROLE_KEY    service-role key (bypasses RLS so no row is hidden)

on:
  schedule:
    # Every 15 minutes (best-effort; GitHub may delay scheduled runs under load).
    # Relax to '*/30 * * * *' or '0 * * * *' if you want fewer Actions minutes.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

# Never let two syncs run at once (avoids racing pushes to main).
concurrency:
  group: sync-prds
  cancel-in-progress: false

# The built-in GITHUB_TOKEN needs write access to commit the refreshed PRDs.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # Node 22+ has a native WebSocket, which newer @supabase/supabase-js
          # requires when createClient initializes its Realtime client. On Node 20
          # createClient throws "Node.js 20 detected without native WebSocket support".
          node-version: '22'

      - name: Install @supabase/supabase-js
        run: npm install @supabase/supabase-js@^2.49.1 --no-save --no-package-lock --no-audit --no-fund

      - name: Generate PRDs from the live database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-model-workflow-prds.mjs

      - name: Commit & push when changed
        run: |
          if [ -z "$(git status --porcelain docs/prd/models docs/prd/workflows)" ]; then
            echo "No PRD changes — nothing to commit."
            exit 0
          fi
          git config user.name "wassell-prd-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/prd/models docs/prd/workflows
          git commit -m "chore(prd): sync model & workflow PRDs from live DB"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed (likely a concurrent push to main); retrying..."
            git rebase --abort || true
            sleep 5
          done
          echo "ERROR: could not push after 3 attempts; the next scheduled run will retry." >&2
          exit 1
