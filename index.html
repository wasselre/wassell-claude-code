<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is what makes env(safe-area-inset-*) resolve to
         real values on notched iPhones; without it the installed app
         letterboxes and every inset reads 0. See the "INSTALLED /
         HOME-SCREEN APP" block in src/index.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Icons are generated from the brand mark by scripts/generate-app-icons.mjs.
         They are pre-flattened onto Soft Cream because iOS renders any
         transparency in a home-screen icon as solid BLACK. -->
    <link rel="icon" type="image/png" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Home Screen install (iOS). `apple-mobile-web-app-title` is what shows
         under the icon — kept short so it doesn't truncate. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="وصل" />
    <meta name="theme-color" content="#B8734F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>وصل العقارية | Wassel Real Estate</title>
  </head>
  <body>
    <!-- Boot loader — shown until React's first paint replaces #root. Without
         it a cold launch (esp. opening a deep link from a push notification)
         shows a blank white page while the JS downloads/parses and the auth
         session restores. React.createRoot(...).render() replaces these
         children automatically, so there's nothing to remove. -->
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#F5EDE0">
        <div style="width:40px;height:40px;border:3px solid rgba(184,115,79,.25);border-top-color:#B8734F;border-radius:50%;animation:wassel-boot-spin .8s linear infinite"></div>
      </div>
    </div>
    <style>@keyframes wassel-boot-spin{to{transform:rotate(360deg)}}</style>
    <!-- Boot recovery (classic script, runs BEFORE the entry module is fetched).
         vercel.json stamps `Cache-Control: immutable` on /assets/<hash>.js BY PATH,
         so a transient 404/503 for the entry bundle (edge propagation right after
         a deploy) is cached by the browser for a year. Every later load — and the
         version poller's forced reload that caused the first one — then shows
         this spinner forever (live incident 2026-09-13). The entry module's
         fetch failure fires a capture-phase `error` on the <script>; re-fetch
         the same URL with cache:'reload' (overwrites the cached error entry),
         then reload ONCE. If that still fails, show a retry screen instead of an
         endless spinner. main.tsx clears the guard once the app has mounted. -->
    <script>
      (function () {
        var KEY = 'wassell_boot_recovered';
        function heal(src) {
          return fetch(src, { cache: 'reload' }).then(function (r) { return r.ok; }, function () { return false; });
        }
        function retryScreen(src) {
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#F5EDE0;font-family:Amiri,serif;color:#4A4E54;text-align:center;padding:24px">' +
            '<div><div style="font-size:20px;margin-bottom:8px">تعذّر تحميل التطبيق</div>' +
            '<div style="font-size:14px;opacity:.8;margin-bottom:16px">The app could not be loaded. Check your connection and try again.</div>' +
            '<button id="wassel-boot-retry" style="background:#B8734F;color:#fff;border:0;border-radius:8px;padding:10px 20px;font-family:inherit;font-size:16px;cursor:pointer">إعادة المحاولة · Retry</button></div></div>';
          var btn = document.getElementById('wassel-boot-retry');
          if (btn) btn.onclick = function () {
            btn.disabled = true;
            try { sessionStorage.removeItem(KEY); } catch (_) {}
            heal(src).then(function () { location.reload(); });
          };
        }
        window.addEventListener('error', function (e) {
          var el = e.target;
          if (!el || el.tagName !== 'SCRIPT' || !el.src || el.src.indexOf('/assets/') === -1) return;
          var already = false;
          try { already = !!sessionStorage.getItem(KEY); sessionStorage.setItem(KEY, '1'); } catch (_) {}
          if (already) { retryScreen(el.src); return; }
          heal(el.src).then(function () { location.reload(); });
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
